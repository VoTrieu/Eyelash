<div class="min-h-screen bg-linear-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center px-6 py-12">
  <div class="max-w-2xl w-full">
    <!-- Animated Background Elements -->
    <div class="absolute inset-0 overflow-hidden">
      <div class="absolute top-20 left-10 w-72 h-72 bg-sky-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>
      <div class="absolute -bottom-8 right-10 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse animation-delay-2000"></div>
    </div>

    <!-- Content -->
    <div class="relative z-10 text-center">
      <!-- 404 Number -->
      <div class="mb-8">
        <span class="text-9xl font-black bg-clip-text text-transparent bg-linear-to-r from-sky-400 to-purple-500">
          404
        </span>
      </div>

      <!-- Title -->
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">
        Page Not Found
      </h1>

      <!-- Subtitle -->
      <p class="text-lg text-slate-300 mb-12 max-w-md mx-auto">
        Sorry, the page you're looking for doesn't exist or has been moved. Let's get you back on track.
      </p>

      <!-- Illustration -->
      <div class="mb-12">
        <div class="relative inline-block">
          <div class="w-64 h-40 bg-linear-to-br from-sky-400/10 to-purple-500/10 rounded-3xl border border-slate-700 flex items-center justify-center">
            <div class="text-6xl">🔍</div>
          </div>
          <div class="absolute -top-4 -right-4 w-16 h-16 bg-sky-500/20 rounded-full blur-2xl"></div>
          <div class="absolute -bottom-4 -left-4 w-16 h-16 bg-purple-500/20 rounded-full blur-2xl"></div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
        <p-button
          (onClick)="goHome()"
          label="Go Home"
          icon="pi pi-home"
          styleClass="p-button-rounded p-button-lg px-8"
          [style]="{'background': 'linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%)', 'border': 'none'}"
        ></p-button>
        
        <p-button
          (onClick)="goBack()"
          label="Go Back"
          icon="pi pi-arrow-left"
          styleClass="p-button-rounded p-button-lg px-8 p-button-text"
          [style]="{'color': '#cbd5e1', 'border': '1px solid #64748b'}"
        ></p-button>
      </div>

      <!-- Additional Help Text -->
      <div class="mt-12 pt-8 border-t border-slate-700">
        <p class="text-sm text-slate-400 mb-4">
          Need help? <a href="mailto:support@eyelash.com" class="text-sky-400 hover:text-sky-300 font-semibold transition-colors">Contact Support</a>
        </p>
      </div>
    </div>
  </div>
</div>
