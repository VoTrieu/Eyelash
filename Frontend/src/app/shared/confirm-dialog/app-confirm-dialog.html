<p-dialog
  [visible]="confirmDialogService.visible()"
  (visibleChange)="$event ? confirmDialogService.visible.set(true) : confirmDialogService.reject()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="false"
  [style]="{ width: 'min(30rem, 94vw)' }"
  styleClass="overflow-hidden rounded-4xl"
>
  <div class="grid gap-5 p-2">
    <div class="flex items-start gap-4">
      <div class="grid h-14 w-14 shrink-0 place-items-center rounded-3xl" [ngClass]="iconClass()">
        <i [class]="confirmDialogService.state().icon + ' text-2xl'"></i>
      </div>

      <div>
        <h2 class="text-2xl font-semibold text-slate-950 dark:text-white">
          {{ confirmDialogService.state().title }}
        </h2>
        <p class="mt-2 leading-7 text-slate-600 dark:text-slate-300">
          {{ confirmDialogService.state().message }}
        </p>
        @if (confirmDialogService.state().details) {
          <p class="mt-3 rounded-2xl bg-slate-50 p-3 text-sm leading-6 text-slate-500 dark:bg-slate-950 dark:text-slate-400">
            {{ confirmDialogService.state().details }}
          </p>
        }
      </div>
    </div>

    <div class="flex flex-col-reverse gap-2 pt-2 sm:flex-row sm:justify-end">
      <button
        pButton
        type="button"
        [label]="confirmDialogService.state().cancelLabel"
        severity="secondary"
        class="p-button-outlined"
        (click)="confirmDialogService.reject()"
      ></button>
      <button
        pButton
        type="button"
        [label]="confirmDialogService.state().confirmLabel"
        [severity]="confirmSeverity()"
        (click)="confirmDialogService.accept()"
      ></button>
    </div>
  </div>
</p-dialog>
