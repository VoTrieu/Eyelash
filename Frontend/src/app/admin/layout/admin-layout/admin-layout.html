<div class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <app-admin-topbar></app-admin-topbar>

  @if (sidebarService.sidebarOpen()) {
    <div
      class="fixed inset-x-0 top-16 bottom-0 z-30 bg-slate-900/40 dark:bg-black/60 lg:hidden"
      (click)="sidebarService.close()"
    ></div>
  }

  <div class="pt-16">
    <div class="relative">
      <app-admin-sidebar></app-admin-sidebar>
      <main
        class="content-area flex-1 p-4 sm:p-6"
        [class.desktop-sidebar-open]="sidebarService.sidebarOpen()"
      >
        <router-outlet></router-outlet>
      </main>
    </div>

    <app-admin-footer></app-admin-footer>
  </div>
</div>
