<div class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <app-admin-topbar (heightChange)="setTopbarHeight($event)"></app-admin-topbar>

  @if (sidebarService.sidebarOpen()) {
    <div
      class="fixed inset-x-0 bottom-0 z-30 bg-slate-900/40 dark:bg-black/60 lg:hidden"
      [style.top.px]="topbarHeight()"
      (click)="sidebarService.close()"
    ></div>
  }

  <div class="flex min-h-screen flex-col pb-24" [style.padding-top.px]="topbarHeight()">
    <div class="relative flex min-h-0 flex-1 flex-col">
      <app-admin-sidebar [topbarHeight]="topbarHeight()"></app-admin-sidebar>
      <main
        class="w-full flex-1 p-4 transition-[margin-left,width] duration-300 ease-in-out sm:p-6"
        [ngClass]="sidebarService.sidebarOpen() ? 'lg:ml-80 lg:w-[calc(100%-20rem)]' : ''"
      >
        <router-outlet></router-outlet>
      </main>

      <div
        class="fixed inset-x-0 bottom-0 z-40 w-full transition-[margin-left,width] duration-300 ease-in-out"
        [ngClass]="sidebarService.sidebarOpen() ? 'lg:ml-80 lg:w-[calc(100%-20rem)]' : ''"
      >
        <app-admin-footer></app-admin-footer>
      </div>
    </div>
  </div>
</div>
