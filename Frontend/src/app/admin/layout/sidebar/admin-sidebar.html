<aside
  class="admin-sidebar fixed left-0 z-40 w-80 overflow-y-auto border-r border-slate-200 bg-white p-0 shadow-xl transition-transform duration-300"
  [style.top.px]="64"
  [style.height]="'calc(100vh - 64px)'"
  [style.transform]="sidebarService.sidebarOpen() ? 'translateX(0)' : 'translateX(-100%)'">
  <div class="flex items-center justify-between border-b border-slate-200 px-4 py-5">
    <div class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">Admin navigation</div>
    <button pButton type="button" icon="pi pi-times" class="p-button-rounded p-button-text text-slate-700 lg:hidden" (click)="sidebarService.close()"></button>
  </div>
  <div class="p-4">
    <p-panelMenu [model]="items" class="admin-panelmenu"></p-panelMenu>
  </div>
</aside>
