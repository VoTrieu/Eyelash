<aside
  class="admin-sidebar fixed left-0 z-40 w-80 overflow-y-auto border-r border-slate-200 bg-white p-0 shadow-xl transition-transform duration-300 dark:border-slate-800 dark:bg-slate-950"
  [style.top.px]="topbarHeight()"
  [style.height]="'calc(100vh - ' + topbarHeight() + 'px)'"
  [style.transform]="sidebarService.sidebarOpen() ? 'translateX(0)' : 'translateX(-100%)'">
  <div class="flex items-center justify-between border-b border-slate-200 px-4 py-5 dark:border-slate-800">
    <div class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">Admin navigation</div>
    <button pButton type="button" icon="pi pi-times" class="p-button-rounded p-button-text text-slate-700 dark:text-slate-200 lg:hidden" (click)="sidebarService.close()"></button>
  </div>
  <div class="p-4">
    <p-panelMenu [model]="items" class="admin-panelmenu"></p-panelMenu>
  </div>
</aside>
