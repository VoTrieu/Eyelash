<header class="admin-topbar fixed inset-x-0 top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur shadow-sm">
  <div class="flex items-center justify-between gap-3 px-4 py-3">
    <div class="flex items-center gap-3">
      <button pButton type="button" icon="pi pi-bars" class="p-button-rounded p-button-text text-slate-700" (click)="sidebarService.toggle()"></button>
      <div>
        <div class="text-lg font-semibold text-slate-900">Admin</div>
        <div class="text-sm text-slate-500">Manage content, users, and settings</div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button pButton type="button" icon="pi pi-search" class="p-button-text text-slate-600"></button>
      <button pButton type="button" icon="pi pi-bell" class="p-button-text text-slate-600"></button>
      <button pButton type="button" icon="pi pi-user" class="p-button-rounded p-button-outlined"></button>
    </div>
  </div>
</header>
