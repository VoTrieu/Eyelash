<header class="admin-topbar fixed inset-x-0 top-0 z-50 border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur dark:border-slate-800 dark:bg-slate-950/95">
  <div class="flex items-center justify-between gap-3 px-4 py-3">
    <div class="flex items-center gap-3">
      <button pButton type="button" icon="pi pi-bars" class="p-button-rounded p-button-text text-slate-700 dark:text-slate-200" (click)="sidebarService.toggle()"></button>
      <img src="/brand/kims-brow-lash-mark.svg" alt="Kim's Brow & Lash mark" class="h-11 w-11 rounded-2xl object-contain" />
      <div>
        <div class="text-lg font-semibold text-slate-900 dark:text-slate-50">Kim's Brow & Lash</div>
        <div class="text-sm text-slate-500 dark:text-slate-400">Manage appointments, services, and reviews</div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button
        pButton
        type="button"
        [icon]="themeService.mode() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
        class="p-button-rounded p-button-text text-slate-600 dark:text-slate-200"
        [attr.aria-label]="themeService.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="themeService.toggle()"></button>
      <button pButton type="button" icon="pi pi-search" class="p-button-text text-slate-600 dark:text-slate-300"></button>
      <button pButton type="button" icon="pi pi-bell" class="p-button-text text-slate-600 dark:text-slate-300"></button>

      <p-menu #userMenu [model]="userMenuItems" [popup]="true"></p-menu>
      <button
        type="button"
        class="flex items-center gap-2 rounded-full border border-slate-200 bg-white px-2 py-1 text-left transition hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-900 dark:hover:bg-slate-800"
        (click)="userMenu.toggle($event)">
        @if (avatarUrl()) {
          <p-avatar [image]="avatarUrl()" shape="circle" />
        } @else {
          <p-avatar [label]="avatarLabel()" shape="circle" />
        }
        <span class="hidden max-w-40 truncate text-sm font-semibold text-slate-700 dark:text-slate-200 sm:inline">
          {{ currentUser()?.displayName || 'Admin' }}
        </span>
        <i class="pi pi-chevron-down text-xs text-slate-500"></i>
      </button>
    </div>
  </div>
</header>
