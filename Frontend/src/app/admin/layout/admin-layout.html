<div class="min-h-screen bg-slate-50 text-slate-900">
  <app-admin-topbar></app-admin-topbar>

  @if (sidebarService.sidebarOpen()){
    <div  class="fixed inset-x-0 top-16 bottom-0 z-30 bg-slate-900/40 lg:hidden" (click)="sidebarService.close()"></div>
  }

  <div class="pt-16">
    <div class="relative flex">
      <app-admin-sidebar></app-admin-sidebar>

      <main class="content-area flex-1 p-4 sm:p-6" [class.desktop-sidebar-open]="sidebarService.sidebarOpen()">
        <section class="rounded-4xl border border-slate-200 bg-white p-6 shadow-sm">
          <div class="mb-6 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div>
              <h1 class="text-2xl font-semibold text-slate-900">Admin dashboard</h1>
              <p class="text-slate-500">A modern admin layout built with PrimeNG and Tailwind CSS.</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
              <button pButton type="button" label="New page" icon="pi pi-plus" class="p-button-outlined"></button>
              <button pButton type="button" label="View analytics" icon="pi pi-chart-line"></button>
            </div>
          </div>

          <app-admin-dashboard></app-admin-dashboard>
        </section>
      </main>
    </div>

    <app-admin-footer></app-admin-footer>
  </div>
</div>
