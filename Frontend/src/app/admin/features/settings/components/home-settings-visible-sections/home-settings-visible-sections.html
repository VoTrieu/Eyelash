<p-card [formGroup]="form()">
  <ng-template pTemplate="header">
    <div class="px-5 pt-5">
      <h2 class="text-xl font-semibold text-slate-950 dark:text-white">Visible sections</h2>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Turn home page sections on or off.</p>
    </div>
  </ng-template>

  <div class="grid gap-4">
    <label class="flex items-center gap-3">
      <p-checkbox formControlName="showServicesSection" [binary]="true"></p-checkbox>
      <span class="font-medium text-slate-700 dark:text-slate-200">Show services preview</span>
    </label>
    <label class="flex items-center gap-3">
      <p-checkbox formControlName="showGallerySection" [binary]="true"></p-checkbox>
      <span class="font-medium text-slate-700 dark:text-slate-200">Show gallery</span>
    </label>
    <label class="flex items-center gap-3">
      <p-checkbox formControlName="showReviewsSection" [binary]="true"></p-checkbox>
      <span class="font-medium text-slate-700 dark:text-slate-200">Show reviews preview</span>
    </label>
    <label class="flex items-center gap-3">
      <p-checkbox formControlName="showVisitSection" [binary]="true"></p-checkbox>
      <span class="font-medium text-slate-700 dark:text-slate-200">Show visit/contact section</span>
    </label>
  </div>
</p-card>
