<p-card [formGroup]="form()">
  <ng-template pTemplate="header">
    <div class="px-5 pt-5">
      <h2 class="text-xl font-semibold text-slate-950 dark:text-white">Gallery images</h2>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
        Replace the images shown in the client home page carousel.
      </p>
    </div>
  </ng-template>

  <div class="grid gap-4 sm:grid-cols-2">
    @for (slot of slots; track slot.imageType) {
      <div class="rounded-3xl border border-slate-200 p-3 dark:border-slate-800">
        <div class="h-32 overflow-hidden rounded-2xl bg-slate-100 dark:bg-slate-800">
          <img
            [src]="previewImage()(form().get(slot.urlControl)?.value, previewFor(slot.imageType))"
            [alt]="slot.title"
            class="h-full w-full object-cover"
          />
        </div>

        <label class="mt-3 grid gap-2">
          <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">{{ slot.title }}</span>
          <input pInputText [formControlName]="slot.titleControl" />
        </label>

        <p-fileUpload
          mode="basic"
          accept="image/*"
          maxFileSize="4194304"
          invalidFileSizeMessageSummary="File too large"
          invalidFileSizeMessageDetail="Maximum upload size is 4 MB"
          chooseLabel="Replace"
          chooseIcon="pi pi-image"
          class="mt-3 block"
          [auto]="false"
          [customUpload]="true"
          (onSelect)="selectImage(slot.imageType, $event)"
        />
      </div>
    }
  </div>
</p-card>
