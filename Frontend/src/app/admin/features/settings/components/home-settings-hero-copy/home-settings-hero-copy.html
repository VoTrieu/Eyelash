<p-card [formGroup]="form()">
  <ng-template pTemplate="header">
    <div class="px-5 pt-5">
      <h2 class="text-xl font-semibold text-slate-950 dark:text-white">Hero copy</h2>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">These fields control the main text and buttons.</p>
    </div>
  </ng-template>

  <div class="grid gap-4">
    <label class="grid gap-2">
      <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Eyebrow</span>
      <input pInputText formControlName="heroEyebrow" />
    </label>

    <label class="grid gap-2">
      <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Title</span>
      <input pInputText formControlName="heroTitle" />
    </label>

    <label class="grid gap-2">
      <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Subtitle</span>
      <textarea pTextarea formControlName="heroSubtitle" rows="4"></textarea>
    </label>

    <div class="grid gap-4 md:grid-cols-2">
      <label class="grid gap-2">
        <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Primary button label</span>
        <input pInputText formControlName="primaryButtonLabel" />
      </label>
      <label class="grid gap-2">
        <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Primary button link</span>
        <input pInputText formControlName="primaryButtonLink" placeholder="/services" />
      </label>
      <label class="grid gap-2">
        <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Secondary button label</span>
        <input pInputText formControlName="secondaryButtonLabel" />
      </label>
      <label class="grid gap-2">
        <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Secondary button link</span>
        <input pInputText formControlName="secondaryButtonLink" placeholder="/book-appointment" />
      </label>
    </div>
  </div>
</p-card>
