<section class="space-y-5">
  <div class="overflow-hidden rounded-4xl border border-rose-100 bg-linear-to-br from-rose-50 via-white to-amber-50 p-6 shadow-sm dark:border-slate-800 dark:from-slate-900 dark:via-slate-950 dark:to-slate-900">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.35em] text-rose-500">Client home page</p>
        <h1 class="mt-3 text-3xl font-bold text-slate-950 dark:text-white">Home Page Settings</h1>
        <p class="mt-2 max-w-2xl text-slate-600 dark:text-slate-300">
          Update the first impression clients see when they visit Kim's Brow & Lash.
        </p>
      </div>

      <div class="flex flex-wrap gap-2">
        <button
          pButton
          type="button"
          label="Reload"
          icon="pi pi-refresh"
          severity="secondary"
          [loading]="loading()"
          (click)="loadSettings()"
        ></button>
        <button
          pButton
          type="button"
          label="Save settings"
          icon="pi pi-save"
          [loading]="saving()"
          (click)="saveSettings()"
        ></button>
      </div>
    </div>
  </div>

  <form
    [formGroup]="form"
    class="settings-form grid gap-5 xl:grid-cols-[1.15fr_0.85fr]"
    [class.was-submitted]="saveAttempted()"
  >
    <div class="space-y-5">
      <app-home-settings-hero-copy [form]="form"></app-home-settings-hero-copy>
      <app-home-settings-gallery-images
        [form]="form"
        [previewImage]="previewImage"
        [galleryImageOnePreview]="galleryImageOnePreview()"
        [galleryImageTwoPreview]="galleryImageTwoPreview()"
        [galleryImageThreePreview]="galleryImageThreePreview()"
        [galleryImageFourPreview]="galleryImageFourPreview()"
        [galleryImageFivePreview]="galleryImageFivePreview()"
        [galleryImageSixPreview]="galleryImageSixPreview()"
        (imageSelected)="onGalleryImageSelected($event.imageType, $event.event)"
      ></app-home-settings-gallery-images>
      <app-home-settings-stats-signature [form]="form"></app-home-settings-stats-signature>
    </div>

    <div class="space-y-5">
      <app-home-settings-hero-images
        [form]="form"
        [previewImage]="previewImage"
        [heroMainPreview]="heroMainPreview()"
        [heroSecondaryPreview]="heroSecondaryPreview()"
        [heroLogoPreview]="heroLogoPreview()"
        (imageSelected)="onHeroImageSelected($event.imageType, $event.event)"
      ></app-home-settings-hero-images>
      <app-home-settings-visible-sections [form]="form"></app-home-settings-visible-sections>
    </div>
  </form>
</section>
