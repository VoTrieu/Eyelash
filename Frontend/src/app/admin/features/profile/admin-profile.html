<section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <div class="flex flex-col gap-5 sm:flex-row sm:items-center">
    @if (avatarUrl()) {
      <p-avatar [image]="avatarUrl()" shape="circle" [style]="{ width: '96px', height: '96px' }" />
    } @else {
      <p-avatar [label]="avatarLabel()" shape="circle" [style]="{ width: '96px', height: '96px', 'font-size': '2rem' }" />
    }

    <div>
      <p class="text-sm font-semibold uppercase tracking-wide text-rose-600 dark:text-rose-400">Profile</p>
      <h1 class="mt-1 text-2xl font-semibold text-slate-950 dark:text-slate-50">
        {{ currentUser()?.displayName || 'Admin' }}
      </h1>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{ currentUser()?.email }}</p>
    </div>
  </div>

  <div class="mt-6 grid gap-3 sm:grid-cols-2">
    <div class="rounded-md bg-slate-50 p-4 dark:bg-slate-800">
      <div class="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">Display name</div>
      <div class="mt-1 font-semibold text-slate-950 dark:text-slate-50">{{ currentUser()?.displayName || 'Not set' }}</div>
    </div>

    <div class="rounded-md bg-slate-50 p-4 dark:bg-slate-800">
      <div class="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">Email</div>
      <div class="mt-1 font-semibold text-slate-950 dark:text-slate-50">{{ currentUser()?.email }}</div>
    </div>
  </div>
</section>
