<section class="rounded-4xl border border-slate-200 bg-white p-6 mb-4 shadow-sm">
  <div class="mb-6 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Manage Services</h1>
      <p class="text-slate-500">Add, edit, or remove services offered.</p>
    </div>
    <div class="flex flex-wrap items-center gap-3">
      <button pButton type="button" label="Add Service" icon="pi pi-plus" (click)="openNew()"></button>
    </div>
  </div>
</section>

<div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm overflow-hidden">
  <p-table [value]="services()" [paginator]="true" [rows]="10" responsiveLayout="scroll" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Duration</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-service>
      <tr>
        <td>{{ service.name }}</td>
        <td>{{ service.price | currency }}</td>
        <td>{{ service.durationInMinutes }} mins</td>
        <td>
          <span [class]="service.isAvailable ? 'text-emerald-600 font-semibold' : 'text-red-600 font-semibold'">
            {{ service.isAvailable ? 'Available' : 'Unavailable' }}
          </span>
        </td>
        <td>
          <div class="flex gap-2">
            <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-sm" (click)="editService(service)"></button>
            <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger p-button-sm" (click)="deleteService(service)"></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center py-4 text-slate-500">No services found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [header]="isEditing() ? 'Edit Service' : 'New Service'" [(visible)]="displayDialog" [modal]="true" [style]="{width: '450px'}" [draggable]="false" [resizable]="false">
  <form [formGroup]="serviceForm" (ngSubmit)="saveService()" class="flex flex-col gap-4 mt-4">
    <div class="flex flex-col gap-2">
      <label for="name" class="font-semibold text-sm">Name</label>
      <input pInputText id="name" formControlName="name" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="price" class="font-semibold text-sm">Price</label>
      <p-inputNumber id="price" formControlName="price" mode="currency" currency="USD" locale="en-US" styleClass="w-full"></p-inputNumber>
    </div>

    <div class="flex flex-col gap-2">
      <label for="durationInMinutes" class="font-semibold text-sm">Duration (Minutes)</label>
      <p-inputNumber id="durationInMinutes" formControlName="durationInMinutes" styleClass="w-full"></p-inputNumber>
    </div>

    <div class="flex flex-col gap-2">
      <label for="description" class="font-semibold text-sm">Description</label>
      <textarea id="description" formControlName="description" rows="3" class="w-full border rounded p-2 border-slate-300"></textarea>
    </div>

    <div class="flex items-center gap-2 mt-2">
      <p-checkbox formControlName="isAvailable" [binary]="true" inputId="isAvailable"></p-checkbox>
      <label for="isAvailable" class="font-semibold text-sm cursor-pointer">Available</label>
    </div>

    <div class="flex justify-end gap-2 mt-4">
      <button pButton type="button" label="Cancel" class="p-button-text p-button-secondary" (click)="displayDialog.set(false)"></button>
      <button pButton type="submit" label="Save" [disabled]="serviceForm.invalid"></button>
    </div>
  </form>
</p-dialog>
