<p-dialog
  [header]="isEditing() ? 'Edit service' : 'New service'"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [style]="{ width: 'min(640px, 94vw)' }"
  [draggable]="false"
  [resizable]="false"
>
  <form [formGroup]="serviceForm" (ngSubmit)="submit()" class="mt-2 grid gap-4">
    <div class="grid gap-4 md:grid-cols-2">
      <div class="grid gap-2">
        <label for="name" class="text-sm font-semibold text-slate-700 dark:text-slate-300">
          Name
        </label>
        <input pInputText id="name" formControlName="name" />
      </div>

      <div class="grid gap-2">
        <label for="price" class="text-sm font-semibold text-slate-700 dark:text-slate-300">
          Price
        </label>
        <p-inputNumber
          id="price"
          formControlName="price"
          mode="currency"
          currency="USD"
          locale="en-US"
          class="w-full"
        />
      </div>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
      <div class="grid gap-2">
        <label
          for="durationInMinutes"
          class="text-sm font-semibold text-slate-700 dark:text-slate-300"
        >
          Duration
        </label>
        <p-inputNumber
          id="durationInMinutes"
          formControlName="durationInMinutes"
          suffix=" min"
          class="w-full"
        />
      </div>

      <div class="flex items-end gap-3 pb-2">
        <p-checkbox formControlName="isAvailable" [binary]="true" inputId="isAvailable" />
        <label
          for="isAvailable"
          class="cursor-pointer text-sm font-semibold text-slate-700 dark:text-slate-300"
        >
          Available for booking
        </label>
      </div>
    </div>

    <div class="grid gap-2">
      <label for="description" class="text-sm font-semibold text-slate-700 dark:text-slate-300">
        Description
      </label>
      <textarea
        pTextarea
        id="description"
        formControlName="description"
        rows="4"
        class="w-full"
      ></textarea>
    </div>

    <div class="grid gap-2">
      <label for="uploadFile" class="text-sm font-semibold text-slate-700 dark:text-slate-300">
        Photos
      </label>
      <div class="flex flex-wrap items-center gap-3">
        @if (isEditing() && existingPhotos().length) {
          <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
            @for (photo of existingPhotos(); track photo.id) {
              <div
                class="relative overflow-hidden rounded-md border border-slate-200 dark:border-slate-700"
              >
                <img
                  [src]="imageUrl(photo.url)"
                  alt="Service photo"
                  class="aspect-square w-full object-cover"
                />

                <button
                  pButton
                  type="button"
                  icon="pi pi-trash"
                  class="p-button-rounded p-button-danger p-button-sm absolute right-2 top-2"
                  (click)="removeExistingPhoto(photo)"
                ></button>

                @if (photo.isMain) {
                  <span
                    class="absolute bottom-2 left-2 rounded bg-slate-950/80 px-2 py-1 text-xs font-semibold text-white"
                  >
                    Main
                  </span>
                }
              </div>
            }
          </div>
        }

        <p-fileUpload
          id="uploadFile"
          #uploadFile
          mode="advanced"
          accept="image/*"
          maxFileSize="4194304"
          chooseLabel="Choose images"
          chooseIcon="pi pi-image"
          showUploadButton="false"
          showCancelButton="false"
          class="w-full"
          invalidFileSizeMessageSummary="File too large"
          invalidFileSizeMessageDetail="Maximum upload size is 4 MB"
          [multiple]="true"
          [customUpload]="true"
          (onSelect)="onPhotosSelected($event)"
        />
      </div>
      @if (selectedFiles().length) {
        <p class="text-sm text-slate-500 dark:text-slate-400">
          {{ selectedFiles().length }} photo{{ selectedFiles().length === 1 ? '' : 's' }}
          selected.
        </p>
      }
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <button
        pButton
        type="button"
        label="Cancel"
        class="p-button-text p-button-secondary"
        (click)="onVisibleChange(false)"
      ></button>
      <button
        pButton
        type="submit"
        label="Save"
        icon="pi pi-check"
        [loading]="saving()"
        [disabled]="serviceForm.invalid"
      ></button>
    </div>
  </form>
</p-dialog>
