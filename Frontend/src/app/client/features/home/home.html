<app-home-hero [settings]="homeSettings()"></app-home-hero>

@if (homeSettings().showServicesSection) {
  <app-home-services-preview></app-home-services-preview>
}

@if (homeSettings().showGallerySection) {
  <app-home-gallery-section [settings]="homeSettings()"></app-home-gallery-section>
}

@if (homeSettings().showReviewsSection) {
  <app-home-reviews-preview
    [reviews]="homeReviews()"
    [loading]="loadingReviews()"
    [error]="reviewsError()"
  ></app-home-reviews-preview>
}

@if (homeSettings().showVisitSection) {
  <app-home-visit-section [settings]="homeSettings()"></app-home-visit-section>
}
