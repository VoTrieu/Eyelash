<div class="grid content-start gap-5 self-start">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.3em] text-rose-500">Services</p>
      <h2 class="mt-2 text-2xl font-semibold">Choose what you would like done</h2>
    </div>
    <a
      routerLink="/services"
      class="inline-flex w-fit items-center justify-center rounded-full border border-rose-200 bg-white px-5 py-3 text-sm font-semibold text-rose-600 shadow-sm transition hover:border-rose-400 hover:bg-rose-50 dark:border-rose-400/30 dark:bg-slate-900 dark:text-rose-200 dark:hover:bg-rose-400/10"
    >
      Browse all services
    </a>
  </div>

  @if (loading()) {
    <div class="grid min-h-48 place-items-center rounded-4xl border border-stone-200 bg-white/80 text-sm text-slate-500 shadow-sm dark:border-slate-800 dark:bg-slate-900 dark:text-slate-400">
      Loading services...
    </div>
  }

  <div class="grid auto-rows-max content-start items-start gap-4">
    @for (service of services(); track service.id) {
      <button
        type="button"
        class="group relative grid auto-rows-min items-start gap-4 self-start rounded-3xl border bg-white/90 p-3 text-left shadow-sm transition duration-300 hover:-translate-y-0.5 hover:border-rose-300 hover:shadow-lg hover:shadow-rose-100/60 dark:bg-slate-900/90 dark:hover:border-rose-400/60 dark:hover:shadow-black/20 sm:grid-cols-[104px_minmax(0,1fr)_auto]"
        [ngClass]="serviceCardClass(service.id)"
        (click)="toggleService(service.id, !isSelected(service.id))"
      >
        @if (service.mainPhotoUrl) {
          <img
            [src]="imageUrl(service.mainPhotoUrl)"
            [alt]="service.name"
            class="h-28 w-full rounded-2xl object-cover transition duration-500 group-hover:scale-[1.02] sm:h-24 sm:w-24"
          />
        } @else {
          <div class="flex h-28 w-full items-center justify-center rounded-2xl bg-stone-100 text-slate-400 dark:bg-slate-800 sm:h-24 sm:w-24">
            <i class="pi pi-image text-2xl"></i>
          </div>
        }

        <div class="min-w-0 self-start py-1">
          <div class="flex flex-wrap items-center gap-2">
            <h3 class="text-lg font-semibold text-slate-950 dark:text-slate-50">
              {{ service.name }}
            </h3>
            @if (isSelected(service.id)) {
              <span class="rounded-full bg-rose-100 px-3 py-1 text-xs font-semibold text-rose-700 dark:bg-rose-400/15 dark:text-rose-200">
                In your booking
              </span>
            }
          </div>
          <p class="mt-2 line-clamp-2 text-sm leading-6 text-slate-500 dark:text-slate-400">
            {{ service.description }}
          </p>
          <div class="mt-3 flex flex-wrap gap-2 text-sm font-semibold">
            <span class="rounded-full bg-white/80 px-3 py-1 text-slate-700 shadow-sm dark:bg-slate-800 dark:text-slate-200">
              {{ service.price | currency }}
            </span>
            <span class="rounded-full bg-white/80 px-3 py-1 text-slate-700 shadow-sm dark:bg-slate-800 dark:text-slate-200">
              {{ service.durationInMinutes }} min
            </span>
          </div>
        </div>

        <div class="absolute right-4 top-4 sm:static sm:flex sm:items-start sm:justify-end sm:pt-1">
          <p-checkbox
            [binary]="true"
            [ngModel]="isSelected(service.id)"
            [ngModelOptions]="{ standalone: true }"
          />
        </div>
      </button>
    }
  </div>

  @if (!loading() && services().length === 0) {
    <div class="rounded-4xl border border-stone-200 bg-white/80 p-6 text-sm text-slate-500 shadow-sm dark:border-slate-800 dark:bg-slate-900 dark:text-slate-400">
      No selected services were found. Please go back to the services page and choose a service.
    </div>
  }
</div>
