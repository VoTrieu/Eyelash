<div class="min-h-screen overflow-hidden bg-[#fffaf7] text-slate-950 dark:bg-slate-950 dark:text-slate-50">
  <main class="relative">
    <app-booking-hero
      [selectedCount]="selectedServiceIds().length"
      [totalDuration]="totalDuration()"
      [totalPrice]="totalPrice()"
    />

    <section class="mx-auto grid max-w-7xl gap-8 px-4 pb-16 sm:px-6 lg:grid-cols-[minmax(0,1fr)_430px]">
      <app-booking-service-selector
        [services]="visibleServices()"
        [selectedServiceIds]="selectedServiceIds()"
        [loading]="loadingServices()"
        (serviceToggled)="toggleService($event.serviceId, $event.checked)"
      />

      <app-booking-request-form
        [form]="bookingForm"
        [selectedServiceIds]="selectedServiceIds()"
        [selectedServices]="selectedServices()"
        [availableSlots]="availableSlots()"
        [minAppointmentDate]="minAppointmentDate"
        [selectedFilesCount]="selectedFiles().length"
        [loadingSlots]="loadingSlots()"
        [submitting]="submitting()"
        [submitted]="submitted()"
        (submittedForm)="submit()"
        (serviceRemoved)="toggleService($event, false)"
        (photosSelected)="selectedFiles.set($event)"
      />
    </section>
  </main>
</div>
