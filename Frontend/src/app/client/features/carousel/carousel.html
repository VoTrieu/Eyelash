<div>
  <div class="flex flex-col items-center justify-center">
      <img src="./DefineYourLook.png" alt="Define Your Look" class="w-1/4">
      <h1 class="text-6xl text-black font-bold text-center mb-6 mt-4"> Effortless Beauty </h1>
  </div>
  <div class="card container">
    <p-carousel
      [value]="products"
      [numVisible]="2"
      [numScroll]="1"
      [circular]="true"
      [responsiveOptions]="responsiveOptions"
      autoplayInterval="3000"
    >
      <ng-template let-product #item>
        <div class="m-2 pt-2">
          <div class="">
            <div class="relative mx-auto">
              <img
                [src]="product.image"
                [alt]="product.title"
                class="w-full rounded-border"
              />
              <p-tag
                [value]="product.inventoryStatus"
                class="absolute dark:bg-surface-900! left-1 top-1"
              />
            </div>
          </div>
          <div class="mb-4 font-medium">{{ product.title }}</div>
         
        </div>
      </ng-template>
    </p-carousel>
  </div>
</div>
