<div>
  <div class="flex flex-col items-center justify-center">
      <img src="/brand/kims-brow-lash-mark.svg" alt="Kim's Brow & Lash" class="w-24 max-w-[45vw] rounded-3xl">
      <h1 class="mb-4 mt-3 text-center text-4xl font-semibold text-black md:text-5xl">Kim's Brow & Lash</h1>
  </div>
  <div class="card container">
    <p-carousel
      [value]="products"
      [numVisible]="2"
      [numScroll]="1"
      [circular]="true"
      [responsiveOptions]="responsiveOptions"
      autoplayInterval="3000"
    >
      <ng-template let-product #item>
        <div class="m-2 pt-2">
          <div class="">
            <div class="relative mx-auto">
              <img
                [src]="product.image"
                [alt]="product.title"
                class="aspect-4/3 w-full rounded-lg object-cover"
              />
              <p-tag
                [value]="product.inventoryStatus"
                class="absolute dark:bg-surface-900! left-1 top-1"
              />
            </div>
          </div>
          <div class="mb-3 mt-2 text-sm font-medium text-slate-700">{{ product.title }}</div>
         
        </div>
      </ng-template>
    </p-carousel>
  </div>
</div>
