<div
  class="flex items-center justify-center"
  [class.bg-black]="!isScrolled()"
  [class.bg-white]="isScrolled() && themeService.mode() === 'light'"
  [class.bg-slate-950]="isScrolled() && themeService.mode() === 'dark'"
>
  <div class="card container">
    <p-toolbar class="border-0 bg-transparent min-h-24">
      <ng-template #start>
        <img
          [src]="isScrolled() && themeService.mode() === 'light' ? '/brand/kims-brow-lash-logo-dark.svg' : '/brand/kims-brow-lash-logo-light.svg'"
          alt="Kim's Brow & Lash logo"
          class="logo-image h-20 w-56 object-contain"
        />
      </ng-template>
      <ng-template #center class="">
        <div class="items-center gap-1 lg:pr-16">
            <p-button 
                [styleClass]="navButtonClass()"
                routerLink="/"
            label="HOME" text plain/>
          <p-button 
            [styleClass]="navButtonClass()" label="SERVICES" routerLink="/services" text plain />
          <p-button
            [styleClass]="navButtonClass()" label="REVIEWS" routerLink="/reviews" text plain />
          <p-button
            [styleClass]="navButtonClass()" label="BOOK" routerLink="/book-appointment" text plain />
          <p-button 
            [styleClass]="navButtonClass()" label="CONTACT" text plain />
        </div>
      </ng-template>
      <ng-template #end>
        <div class="flex items-center gap-2">
          <p-button
            [icon]="themeService.mode() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
            [styleClass]="navButtonClass()"
            [attr.aria-label]="themeService.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
            text
            rounded
            plain
            (onClick)="themeService.toggle()" />
          <p-button label="Share" severity="contrast" size="small" />
        
        </div>
      </ng-template>
    </p-toolbar>
  </div>
</div>
