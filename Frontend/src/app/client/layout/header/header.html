<div
  class="flex items-center justify-center"
  [class.bg-black]="!isScrolled()"
  [class.bg-white]="isScrolled()"
>
  <div class="card container">
    <p-toolbar class="border-0 bg-transparent h-40">
      <ng-template #start>
        <img
          [src]="isScrolled() ? '/logo.png' : '/logo3.png'"
          alt="Brand logo"
          class="logo-image h-36 w-36"
        />
      </ng-template>
      <ng-template #center class="">
        <div class="items-center gap-2 pr-40">
            <p-button 
                [styleClass]="isScrolled() ? 'text-black hover:bg-gray-200' : 'text-white hover:bg-gray-800'"
            label="HOME" text plain/>
          <p-button 
            [styleClass]="isScrolled() ? 'text-black hover:bg-gray-200' : 'text-white hover:bg-gray-800'" label="BEHIND THE EDIT" text plain />
          <p-button 
            [styleClass]="isScrolled() ? 'text-black hover:bg-gray-200' : 'text-white hover:bg-gray-800'" label="SERVICES" text plain />
          <p-button 
            [styleClass]="isScrolled() ? 'text-black hover:bg-gray-200' : 'text-white hover:bg-gray-800'" label="PORTFOLIO" text plain />
          <p-button 
            [styleClass]="isScrolled() ? 'text-black hover:bg-gray-200' : 'text-white hover:bg-gray-800'" label="CONTACT" text plain />
        </div>
      </ng-template>
      <ng-template #end>
        <div class="flex items-center gap-2">
          <p-button label="Share" severity="contrast" size="small" />
          <p-avatar
            image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
            [style]="{ width: '32px', height: '32px' }"
          />
        </div>
      </ng-template>
    </p-toolbar>
  </div>
</div>
