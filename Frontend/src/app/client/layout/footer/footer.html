<div class="grid gap-10 bg-black px-6 py-12 text-sm text-white sm:grid-cols-2 lg:grid-cols-[1.2fr_1fr_1fr_1.2fr] lg:px-12">
  <div>
    <img src="/brand/kims-brow-lash-logo-light.svg" alt="Kim's Brow & Lash logo" class="h-24" />
  </div>

  <div class="flex flex-col gap-4">
    <h4 class="mb-2 text-base font-semibold">Contact</h4>
    <a [href]="emailHref()" class="text-gray-400 hover:text-gray-200">{{ settings().studioEmail }}</a>
    @if (settings().studioPhone) {
      <a [href]="phoneHref()" class="text-gray-400 hover:text-gray-200">{{ settings().studioPhone }}</a>
    }
    <span class="text-gray-400">{{ settings().studioAddress }}</span>
  </div>

  <div class="flex flex-col gap-4">
    <h4 class="mb-2 text-base font-semibold">Menu</h4>
    <a routerLink="/" class="text-gray-400 hover:text-gray-200">Home</a>
    <a routerLink="/services" class="text-gray-400 hover:text-gray-200">Services</a>
    <a routerLink="/reviews" class="text-gray-400 hover:text-gray-200">Reviews</a>
    <a routerLink="/book-appointment" class="text-gray-400 hover:text-gray-200">Booking</a>
    <a routerLink="/contact" class="text-gray-400 hover:text-gray-200">Contact</a>
  </div>

  <div class="flex flex-col">
    <h4 class="mb-4 text-base font-semibold">Follow Us</h4>
    <div class="flex items-center gap-4">
      <a
        href="https://www.facebook.com/profile.php?id=61584718271302"
        class="flex items-center justify-center p-2 rounded-full bg-transparent hover:bg-gray-800"
      >
        <i class="pi pi-facebook text-xl"></i>
      </a>

      <a
        href="https://www.instagram.com/pmu.lash_bykimi/"
        class="flex items-center justify-center p-2 rounded-full bg-transparent hover:bg-gray-800"
      >
        <i class="pi pi-instagram text-xl"></i>
      </a>
    </div>
    <div class="flex flex-col justify-end flex-1">
        <p class="mt-8 text-gray-400">© 2026 Kim's Brow & Lash. All rights reserved.</p>
    </div>
  </div>
</div>
