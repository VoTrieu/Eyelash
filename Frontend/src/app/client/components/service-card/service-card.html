<article
  class="grid gap-4 border-b border-slate-200 bg-white py-6 dark:border-slate-800 dark:bg-slate-950 md:grid-cols-[220px_1fr_auto]">
  <div class="overflow-hidden rounded-lg bg-slate-100 dark:bg-slate-800">
    @if (mainPhotoUrl(); as photoUrl) {
      <img [src]="photoUrl" [alt]="service().name" class="h-52 w-full object-cover md:h-full" />
    } @else {
      <div class="grid h-52 place-items-center text-slate-400 md:h-full">
        <i class="pi pi-image text-3xl"></i>
      </div>
    }
  </div>

  <div class="min-w-0 flex flex-col gap-4">
    <div class="flex items-start gap-3 flex-1">
      <div class="min-w-0 flex-1">
        <h2 class="text-xl font-semibold text-slate-950 dark:text-slate-50">{{ service().name }}</h2>
        <p class="mt-2 line-clamp-3 text-sm leading-6 text-slate-500 dark:text-slate-400">
          {{ service().description }}
        </p>
      </div>

      <div class="rounded-md bg-slate-50 px-4 py-3 text-right dark:bg-slate-900">
        <div class="text-lg font-semibold">{{ service().price | currency }}</div>
        <div class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
          {{ service().durationInMinutes }} min
        </div>
      </div>
    </div>

    @if (previewPhotos().length) {
      <div class="mt-4 flex gap-2">
        @for (photo of previewPhotos(); track photo.id) {
          <img [src]="resolvePhotoUrl(photo.url)" [alt]="service().name" class="h-16 w-16 rounded-md object-cover ring-1 ring-slate-200 dark:ring-slate-700" />
        }
      </div>
    }
  </div>

  <div class="flex items-center justify-between gap-4 md:flex-col md:items-end md:justify-center">
    <label class="flex cursor-pointer items-center gap-2 text-sm font-semibold text-slate-700 dark:text-slate-300">
      Add to booking List
      <p-checkbox [binary]="true" [ngModel]="selected()" (onChange)="onSelectedChange($event)" />
    </label>

    <button pButton type="button" label="Book now" icon="pi pi-calendar" class="p-button-sm" (click)="onBookNow()"></button>
  </div>
</article>
