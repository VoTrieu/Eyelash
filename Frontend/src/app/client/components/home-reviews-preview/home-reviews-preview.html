<section class="bg-white px-4 py-16 text-slate-950 dark:bg-slate-950 dark:text-white sm:px-6">
  <div class="mx-auto max-w-7xl">
    <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.3em] text-rose-500">Recent reviews</p>
        <h2 class="mt-3 font-serif text-4xl font-semibold leading-tight md:text-5xl">
          Fresh notes from our clients
        </h2>
      </div>

      <a
        routerLink="/reviews"
        class="inline-flex w-fit items-center justify-center rounded-full border border-rose-200 px-5 py-3 text-sm font-semibold text-rose-600 transition hover:border-rose-500 hover:bg-rose-50 dark:border-rose-400/40 dark:text-rose-200 dark:hover:bg-rose-400/10"
      >
        View all reviews
      </a>
    </div>

    @if (loading()) {
      <div class="grid min-h-48 place-items-center rounded-3xl border border-stone-200 bg-stone-50 text-slate-500 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-400">
        Loading reviews...
      </div>
    } @else if (error()) {
      <div class="grid min-h-48 place-items-center rounded-3xl border border-stone-200 bg-stone-50 text-center text-slate-500 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-400">
        Reviews are unavailable right now.
      </div>
    } @else if (reviews().length) {
      <div class="grid auto-rows-fr items-stretch gap-5 md:grid-cols-2 xl:grid-cols-3">
        @for (review of reviews(); track review.id) {
          <app-review-card [review]="review"></app-review-card>
        }
      </div>
    } @else {
      <div class="grid min-h-48 place-items-center rounded-3xl border border-stone-200 bg-stone-50 text-center text-slate-500 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-400">
        No reviews yet.
      </div>
    }
  </div>
</section>
