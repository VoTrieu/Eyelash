<section class="bg-[#fff8f3] px-4 py-16 dark:bg-slate-950 sm:px-6">
  <div class="mx-auto grid max-w-7xl gap-8 lg:grid-cols-[0.8fr_1.2fr] lg:items-center">
    <div>
      <p class="text-sm font-semibold uppercase tracking-[0.3em] text-rose-500">Visit us</p>
      <h2 class="mt-3 font-serif text-4xl font-semibold text-slate-950 dark:text-white md:text-5xl">
        Come in calm, leave polished.
      </h2>
      <p class="mt-4 leading-8 text-slate-600 dark:text-slate-300">
        Find Kim's Brow & Lash, choose your appointment time, and let us confirm the details before your visit.
      </p>
      <a
        routerLink="/book-appointment"
        class="mt-7 inline-flex rounded-full bg-slate-950 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-slate-950/15 transition hover:-translate-y-0.5 hover:bg-slate-800 dark:bg-white dark:text-slate-950"
      >
        Request appointment
      </a>
    </div>
    <div class="overflow-hidden rounded-[2.5rem] border border-white/80 bg-white p-3 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <app-map
        [address]="settings().studioAddress"
        [latitude]="settings().studioLatitude"
        [longitude]="settings().studioLongitude"
      ></app-map>
    </div>
  </div>
</section>
