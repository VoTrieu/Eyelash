<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New contact inquiry</title>
</head>
<body style="margin:0; padding:0; background:#f8e8ed; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8e8ed; margin:0; padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px; background:#ffffff; border-radius:24px; overflow:hidden; box-shadow:0 24px 70px rgba(136, 19, 55, .18);">
          <tr>
            <td style="background:#111827; padding:30px 34px; text-align:center;">
              <div style="font-size:12px; letter-spacing:.26em; text-transform:uppercase; color:#f9a8d4; font-weight:700;">New contact inquiry</div>
              <h1 style="margin:12px 0 0; color:#ffffff; font-size:30px; line-height:1.2; font-weight:800;">Message from {{Name}}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:34px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff7f9; border:1px solid #fbcfe8; border-radius:18px;">
                <tr>
                  <td style="padding:18px 20px; border-bottom:1px solid #fbcfe8; color:#111827;"><strong>Name:</strong> {{Name}}</td>
                </tr>
                <tr>
                  <td style="padding:18px 20px; border-bottom:1px solid #fbcfe8; color:#111827;"><strong>Email:</strong> {{Email}}</td>
                </tr>
                <tr>
                  <td style="padding:18px 20px; color:#111827;"><strong>Phone:</strong> {{Phone}}</td>
                </tr>
              </table>

              <div style="margin-top:24px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#9f1239;">Message</div>
              <div style="margin-top:8px; padding:18px 20px; border-radius:18px; background:#ffffff; border:1px solid #fbcfe8; color:#374151; font-size:15px; line-height:1.7; white-space:pre-line;">{{Message}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 34px; background:#fff1f5; text-align:center; color:#9f1239; font-size:13px;">
              Replying to this email will reply directly to {{Email}}.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
